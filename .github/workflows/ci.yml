name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate KPI registry
        run: python -m registry.validate
      - name: Unit tests
        run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: dbt parse (compiles project, checks refs and tests)
        working-directory: dbt
        # parse never connects; the profile only needs the variable to exist
        env:
          BIS_PG_PASSWORD: unused-in-ci
        run: dbt parse --profiles-dir .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    # Build every deployable image (no push; publishing is decided with the VPS deployment).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image + its unit tests
        run: |
          docker build -f api/Dockerfile -t bis-api .
          # The image runs as a non-root user without a writable /app: no pytest cache.
          docker run --rm bis-api pytest -q -p no:cacheprovider tests/api
      - name: Frontend image
        run: docker build -t bis-frontend frontend
      - name: Mock marketing API image
        run: docker build -t bis-mock-marketing-api ingestion/mock_marketing_api
      - name: Contracts are valid JSON
        run: for f in contracts/*.json contracts/examples/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
