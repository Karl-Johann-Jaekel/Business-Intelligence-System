server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API in the same compose network; on the VPS the reverse proxy may route /api directly.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP server for Claude (Streamable HTTP) and its OAuth protected-resource metadata.
    location = /mcp {
        proxy_pass http://mcp:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  # with port: matches the MCP host allow-list
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8001;
        proxy_set_header Host $http_host;  # with port: matches the MCP host allow-list
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
