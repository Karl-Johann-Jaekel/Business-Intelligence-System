[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-intelligence-system"
version = "0.1.0"
description = "End-to-end BI system: ingestion, dbt warehouse, KPI registry, Dagster orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagster==1.13.25",
    "dagster-webserver==1.13.25",
    "dagster-dbt==0.29.25",
    "dagster-postgres==0.29.25",
    "dbt-core==1.12.5",
    "dbt-postgres==1.11.0",
    "psycopg[binary]==3.3.6",
    "psycopg2-binary==2.9.13",  # Dagster run storage driver
    "SQLAlchemy==2.1.3",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "kagglehub==1.0.2",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "statsmodels==0.15.0",
    "anthropic==1.11.0",
    "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1", "jsonschema==4.26.0"]  # jsonschema: contract tests

[project.scripts]
bis = "orchestration.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "registry*", "orchestration*", "api*", "analytics*", "events*", "llm*"]

[tool.dagster]
module_name = "orchestration.definitions"
code_location_name = "bis"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
